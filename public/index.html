<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JC Flicks</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JC Flicks" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" id="meta-theme-color" content="#f7f7f5" />

    <script>
      (function () {
        var match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        var theme = match ? decodeURIComponent(match[1]) : null;
        if (theme && theme !== "default") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="pull-refresh" class="pull-refresh">
      <div class="pull-refresh-spinner"></div>
    </div>

    <header class="app-header">
      <button id="menu-btn" class="btn-icon" aria-label="Menu">☰</button>
      <button id="search-btn" class="btn-icon" aria-label="Search">
        <svg viewBox="0 0 512 512" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path
            d="M500.3 443.7l-119.7-119.7c27.22-40.41 40.65-90.9 33.46-144.7C401.8 87.79 326.8 13.32 235.2 1.723C130.1-11.85-11.85 130.1 1.723 235.2c11.6 91.64 86.08 166.7 177.5 178.9c53.8 7.19 104.3-6.24 144.7-33.46l119.7 119.7c15.62 15.62 40.95 15.62 56.57 0C515.9 484.7 515.9 459.3 500.3 443.7zM79.1 208c0-71.52 57.73-129.6 129.1-129.6s129.1 58.04 129.1 129.6c0 71.64-57.72 129.6-129.1 129.6S79.1 279.6 79.1 208z"
          />
        </svg>
      </button>
      <h1 id="app-title">
        <svg class="header-logo" viewBox="140 140 320 320" aria-hidden="true">
          <defs>
            <path id="chevrons" class="mark-cutout"
                  d="M260 200 l30 15 v15 l-30 -15 Z
                     M260 245 l30 15 v15 l-30 -15 Z
                     M260 290 l30 15 v15 l-30 -15 Z"/>
          </defs>

          <g class="mark-fg">
            <rect x="300" y="195" width="30" height="180" />
            <rect x="260" y="195" width="30" height="180" />
            <rect x="195" y="240" width="30" height="158" transform="rotate(-44 206.723 317.12)" />
            <rect x="300" y="195" width="100" height="25" />
            <rect x="300" y="350" width="100" height="25" />
          </g>

          <g class="mark-dot">
            <circle cx="275" cy="350" r="3" />
            <circle cx="252" cy="365" r="3" />
            <circle cx="275" cy="365" r="3" />
          </g>

          <use href="#chevrons" />
          <use href="#chevrons" transform="rotate(-44 275 260) translate(464.5 -15) scale(-1 1)" />
        </svg>
        <svg class="header-wordmark" viewBox="0 0 552 140" aria-hidden="true">
          <g class="wordmark-fg">
            <!-- F -->
            <rect x="0" y="0" width="26" height="140" />
            <rect x="0" y="0" width="90" height="26" />
            <rect x="0" y="57" width="70" height="26" />

            <!-- L -->
            <rect x="106" y="0" width="26" height="140" />
            <rect x="106" y="114" width="90" height="26" />

            <!-- I -->
            <rect x="212" y="0" width="26" height="140" />

            <!-- C -->
            <rect x="254" y="0" width="90" height="26" />
            <rect x="254" y="0" width="26" height="140" />
            <rect x="254" y="114" width="90" height="26" />

            <!-- K -->
            <rect x="360" y="0" width="26" height="140" />
            <rect x="386" y="72" width="106.4" height="26" transform="rotate(-53.03 386 85)" />
            <rect x="386" y="72" width="84.4" height="26" transform="rotate(40.7 386 85)" />

            <!-- S -->
            <rect x="466" y="0" width="86" height="26" />
            <rect x="466" y="0" width="26" height="70" />
            <rect x="466" y="57" width="86" height="26" />
            <rect x="526" y="57" width="26" height="83" />
            <rect x="466" y="114" width="86" height="26" />
          </g>
        </svg>
        <span class="sr-only">JC Flicks</span>
      </h1>
      <button id="random-btn" class="btn-icon" aria-label="Random pick">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button id="sort-btn" class="btn-icon sort-btn" aria-label="Sort">
        <svg viewBox="0 0 320 512" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M41 288h238c21.4 0 32.1 25.9 17 41L177 448c-9.4 9.4-24.6 9.4-34 0L24 329c-15.1-15.1-4.4-41 17-41zm238-64H41c-21.4 0-32.1-25.9-17-41L143 64c9.4-9.4 24.6-9.4 34 0l119 119c15.1 15.1 4.4 41-17 41z"
          />
        </svg>
      </button>
      <button id="search-bar-close-btn" class="btn-icon" aria-label="Close search" hidden>✕</button>
      <input
        type="text"
        id="search-bar-input"
        class="search-bar-input"
        placeholder="Search your list…"
        autocomplete="off"
        hidden
      />
    </header>

    <div id="search-bar-results" class="search-results search-bar-results" hidden></div>
    <div id="search-bar-overlay" class="search-bar-overlay" hidden></div>

    <div id="tag-filters" class="tag-scroll"></div>

    <main>
      <div id="movie-grid" class="movie-grid"></div>
      <p id="empty-state" class="empty-state" hidden></p>
    </main>

    <button id="add-movie-btn" class="fab" aria-label="Add movie">+</button>
    <button id="scroll-top-btn" class="scroll-top-btn" aria-label="Scroll to top">↑</button>

    <div id="new-toast" class="new-toast"><span id="new-toast-text"></span></div>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="towatch">To Watch</button>
      <button class="tab-btn" data-tab="watched">Watched</button>
    </nav>

    <div id="add-modal" class="sheet-overlay" hidden>
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
          <div class="sheet-header-row">
            <button id="back-btn" class="btn-icon" aria-label="Back" hidden>←</button>
            <h2 id="sheet-title">Add a Movie</h2>
            <button id="close-modal-btn" class="btn-icon" aria-label="Close">✕</button>
          </div>
        </div>

        <div id="step-search" class="sheet-step">
          <div id="search-results" class="search-results"></div>
          <input
            type="text"
            id="search-input"
            placeholder="Search for a movie title…"
            autocomplete="off"
          />
        </div>

        <div id="step-details" class="sheet-step" hidden>
          <div class="selected-movie-summary">
            <img id="selected-poster" alt="" />
            <div>
              <h3 id="selected-title"></h3>
              <p id="selected-year"></p>
            </div>
          </div>

          <div class="field-group">
            <label>Tags</label>
            <div id="tag-picker" class="tag-picker"></div>
            <div class="new-tag-row">
              <input type="text" id="new-tag-input" placeholder="New tag…" />
              <button id="add-tag-btn" class="btn btn-secondary">Add</button>
            </div>
          </div>

          <div class="field-group">
            <label>Whose pick?</label>
            <div class="choice-toggle">
              <button type="button" class="choice-btn" data-choice="jc">JC</button>
              <button type="button" class="choice-btn" data-choice="cc">CC</button>
            </div>
          </div>

          <button id="confirm-add-btn" class="btn btn-primary">Add to list</button>
        </div>
      </div>
    </div>

    <div id="detail-modal" class="sheet-overlay" hidden>
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
          <div class="sheet-header-row">
            <span class="btn-icon-spacer" aria-hidden="true"></span>
            <h2>Movie Details</h2>
            <button id="detail-close-btn" class="btn-icon" aria-label="Close">✕</button>
          </div>
        </div>

        <div class="selected-movie-summary">
          <img id="detail-poster" alt="" />
          <div>
            <h3 id="detail-title"></h3>
            <p id="detail-year"></p>
            <p id="detail-meta" class="detail-meta"></p>
          </div>
        </div>

        <div class="detail-tabs">
          <button type="button" class="detail-tab-btn active" data-detail-tab="info">
            <svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path
                d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-144a32 32 0 1 1 0-64 32 32 0 1 1 0 64z"
              />
            </svg>
            Info
          </button>
          <button type="button" class="detail-tab-btn" data-detail-tab="edit">
            <svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path
                d="M362.7 19.3L314.3 67.7 444.3 197.7l48.4-48.4c25-25 25-65.5 0-90.5L453.3 19.3c-25-25-65.5-25-90.5 0zM421.7 220.3L291.7 90.3 53.1 328.9c-10.7 10.7-18.5 24-22.2 38.6L.9 484.7c-2.4 9.5 .2 19.6 7 26.5s16.9 9.5 26.5 7l117.2-29.3c14.6-3.7 28-11.5 38.6-22.2L421.7 220.3z"
              />
            </svg>
            Edit
          </button>
        </div>

        <div id="detail-tab-info" class="detail-tab-panel">
          <div id="detail-info-loading" class="detail-loading">
            <div class="spinner"></div>
          </div>

          <div id="detail-info-content" hidden>
            <p id="detail-overview" class="detail-overview"></p>

            <div class="field-group">
              <label>Director</label>
              <p id="detail-director" class="detail-value"></p>
            </div>

            <div class="field-group">
              <label>Cast</label>
              <p id="detail-cast" class="detail-value"></p>
            </div>

            <div class="field-group">
              <label>Where to Watch</label>
              <div id="detail-providers" class="provider-row"></div>
              <a id="detail-providers-link" class="provider-attribution" target="_blank" rel="noopener" hidden>
                Streaming data via JustWatch
              </a>
            </div>
          </div>
        </div>

        <div id="detail-tab-edit" class="detail-tab-panel" hidden>
          <div class="field-group">
            <label>Status</label>
            <div class="detail-status-row">
              <div class="detail-status-item">
                <button type="button" id="detail-watched-btn" class="icon-btn watch-btn" aria-label="Toggle watched">○</button>
                <span id="detail-watched-label">Watched</span>
              </div>
              <div class="detail-status-item">
                <button type="button" id="detail-remove-btn" class="icon-btn delete-btn" aria-label="Remove">🗑</button>
                <span id="detail-remove-label">Remove</span>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label>Tags</label>
            <div id="detail-tag-picker" class="tag-picker"></div>
            <div class="new-tag-row">
              <input type="text" id="detail-new-tag-input" placeholder="New tag…" />
              <button id="detail-add-tag-btn" class="btn btn-secondary">Add</button>
            </div>
          </div>

          <div class="field-group">
            <label>Whose pick?</label>
            <div class="choice-toggle">
              <button type="button" class="choice-btn" data-choice="jc" id="detail-choice-jc">JC</button>
              <button type="button" class="choice-btn" data-choice="cc" id="detail-choice-cc">CC</button>
            </div>
          </div>

          <button id="detail-save-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <div id="menu-overlay" class="menu-overlay" hidden>
      <div class="menu-panel">
        <div class="menu-header">
          <h2>Menu</h2>
          <button id="menu-close-btn" class="btn-icon" aria-label="Close">✕</button>
        </div>

        <div class="field-group">
          <label>Theme</label>
          <div id="theme-options" class="theme-options"></div>
        </div>

        <div class="menu-version-block">
          <p id="menu-app-version"></p>
          <p id="menu-version"></p>
          <p id="menu-commit"></p>
        </div>
      </div>
    </div>

    <div id="sort-modal" class="sheet-overlay" hidden>
      <div class="sheet">
        <div class="sheet-header">
          <div class="sheet-handle"></div>
          <div class="sheet-header-row">
            <span class="btn-icon-spacer" aria-hidden="true"></span>
            <h2>Sort By</h2>
            <button id="sort-close-btn" class="btn-icon" aria-label="Close">✕</button>
          </div>
        </div>

        <div id="sort-options" class="sort-options"></div>
      </div>
    </div>

    <div id="random-modal" class="random-overlay" hidden>
      <button id="random-close-btn" class="btn-icon random-close-btn" aria-label="Close">✕</button>

      <div class="random-stage">
        <div id="random-die" class="random-die" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none" />
            <circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
            <circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none" />
            <circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none" />
          </svg>
        </div>

        <div id="random-result" class="random-result" hidden>
          <img id="random-poster" class="random-poster" alt="" />
          <h3 id="random-title"></h3>
          <p id="random-year"></p>
        </div>

        <p id="random-empty" class="random-empty" hidden>No movies match the current filters.</p>
      </div>

      <div id="random-actions" class="random-actions" hidden>
        <button id="random-reroll-btn" class="icon-btn random-reroll-btn" aria-label="Re-roll">
          <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path
              d="M105.1 202.6c7.7-21.8 20.2-42.3 37.8-59.8c62.5-62.5 163.8-62.5 226.3 0L386.3 160H336c-17.7 0-32 14.3-32 32s14.3 32 32 32H463.5h.4c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32s-32 14.3-32 32v51.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5zM39 303.7c-5 1.5-9.8 4.2-13.7 8.2c-4 4-6.7 8.8-8.1 14c-.3 1.2-.6 2.5-.8 3.8c-.3 1.7-.4 3.4-.4 5.1V464c0 17.7 14.3 32 32 32s32-14.3 32-32V412.8l17.6 17.6c87.5 87.4 229.3 87.4 316.7 0c24.4-24.4 42.1-53.1 52.9-83.8c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.5 62.5-163.8 62.5-226.3 0l-.1-.1L109.6 352H160c17.7 0 32-14.3 32-32s-14.3-32-32-32H32.4c-1.6 0-3.2 .1-4.8 .3l-.2 0c-1 .1-1.9 .3-2.9 .5s-1.9 .4-2.9 .7l-.5 .2z"
            />
          </svg>
        </button>
        <button id="random-view-btn" class="btn btn-primary">View Details</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
