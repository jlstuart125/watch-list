<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Watch List</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Watch List" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15151a" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Watch List</h1>
    </header>

    <div id="tag-filters" class="tag-scroll"></div>

    <main>
      <div id="movie-grid" class="movie-grid"></div>
      <p id="empty-state" class="empty-state" hidden></p>
    </main>

    <button id="add-movie-btn" class="fab" aria-label="Add movie">+</button>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="towatch">To Watch</button>
      <button class="tab-btn" data-tab="watched">Watched</button>
    </nav>

    <div id="add-modal" class="sheet-overlay" hidden>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2>Add a Movie</h2>
          <button id="close-modal-btn" class="btn-icon" aria-label="Close">✕</button>
        </div>

        <input
          type="text"
          id="search-input"
          placeholder="Search for a movie title…"
          autocomplete="off"
        />

        <div id="search-results" class="search-results"></div>

        <div id="selected-movie" class="selected-movie" hidden>
          <img id="selected-poster" alt="" />
          <div class="selected-movie-info">
            <h3 id="selected-title"></h3>
            <p id="selected-year"></p>
            <label for="tags-input">Tags (comma separated)</label>
            <input
              type="text"
              id="tags-input"
              placeholder="e.g. October, Horror"
              list="existing-tags"
            />
            <datalist id="existing-tags"></datalist>
            <button id="confirm-add-btn" class="btn btn-primary">Add to list</button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
